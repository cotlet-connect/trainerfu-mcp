[project]
name = "trainerfu-mcp"
version = "1.1.0"
description = "Connect Trainerfu to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Trainerfu API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["trainerfu", "trainerfu api", "trainerfu mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/trainerfu-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=trainerfu"
Source = "https://github.com/cotlet-connect/trainerfu-mcp"

[project.scripts]
trainerfu-mcp = "trainerfu_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"trainerfu_agent.py" = "trainerfu_agent.py"

[tool.hatch.build.targets.sdist]
include = ["trainerfu_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
